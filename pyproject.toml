[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "invisensing"
version = "1.4.0"
description = "Python SDK for the Invisensing Audace DAS environment — reads Audace data files (DAT / HDF5 / TDMS / SEG-Y) and extracts per-channel data (I / Q / arctan / magnitude / phase) via a Rust-backed core."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Invisensing", email = "contact@invisensing.io" },
    { name = "Louis Thievent" },
]
keywords = [
    "DAS",
    "distributed-acoustic-sensing",
    "fiber-optic",
    "geophysics",
    "seismic",
    "demodulation",
    "audace",
    "hdf5",
    "segy",
    "tdms",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Typing :: Typed",
]
# Default install pulls in every format backend so `pip install invisensing`
# Just Works on DAT, HDF5, TDMS, and SEG-Y captures out of the box. The Rust
# core does the heavy lifting (header parse + de-interleave); these libs are
# only consulted for their format-specific metadata + bytes → numpy step.
dependencies = [
    "numpy>=1.20",
    "h5py>=3.0",
    # Registers the HDF5 zstd filter (32015) with h5py: recordings written
    # with the FileWriter's `compression = ZSTD` do not open without it.
    "hdf5plugin>=4.0",
    "npTDMS>=1.6",
    "segyio>=1.9",
]

[project.urls]
Homepage = "https://github.com/invisensing-io/python-lib"
Documentation = "https://invisensing-io.github.io/python-lib/"
Repository = "https://github.com/invisensing-io/python-lib"
Issues = "https://github.com/invisensing-io/python-lib/issues"
Changelog = "https://github.com/invisensing-io/python-lib/releases"

[project.optional-dependencies]
# Aliases retained for backwards compatibility with older installation
# instructions. They are no-ops now — the format backends are part of the
# default install — but `pip install invisensing[hdf5]` still resolves cleanly.
hdf5 = ["h5py>=3.0", "hdf5plugin>=4.0"]
tdms = ["npTDMS>=1.6"]
segy = ["segyio>=1.9"]
all  = ["h5py>=3.0", "hdf5plugin>=4.0", "npTDMS>=1.6", "segyio>=1.9"]
dev  = ["pytest>=8.0", "maturin>=1.5"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "pymdown-extensions>=10.7",
]

[tool.maturin]
# `python-source = "python"` tells maturin where the pure-Python package lives;
# `module-name` tells it the Rust extension is imported as `invisensing._core`,
# so the Rust crate gets copied next to the Python package in the wheel.
python-source = "python"
module-name   = "invisensing._core"
features      = ["pyo3/extension-module"]
# Strip debug symbols from the released wheel — keeps the .so under a few MB.
strip         = true
# Files that should NOT end up in the source distribution. `**`, not `*`:
# a single `*` stops at the first directory level, and `.github/*` let
# `.github/workflows/*.yml` through. The tests ship with the small fixtures
# they read (`tests/assets/*.json`, `*.txt`, `v1/**`), so `pytest` runs from
# the unpacked sdist. Left out: the 18 MB synthetic capture of the legacy
# round trip (`tests/test_File.py` skips without it), and the copy of the
# acquisition's content-type registry, which spells out the cards' former
# variant tags (the registry tests skip without it; this package names the
# cards by their codes only). Cargo.lock ships: the sdist builds with the
# dependency versions CI tested.
exclude       = [
    "tests/output/**",
    "tests/assets/demodulated.dat",
    "tests/assets/content_types_v1.json",
    "target/**",
    "Docs/**",
    ".github/**",
    "Doxyfile",
    "PUBLISHING.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
